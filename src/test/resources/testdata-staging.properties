# ===============================
# STAGING ENVIRONMENT TEST DATA
# ===============================
# Usage: mvn verify -Denvironment=staging
# Or set: export TEST_ENVIRONMENT=staging

# ===============================
# BASE CONFIG
# ===============================
base.url=http://staging.example.com
api.base.url=http://staging-api.example.com

# ===============================
# USERS
# IMPORTANT: Use environment variables for credentials in CI/CD
# export ADMIN_PASSWORD=your_staging_password
# ===============================
admin.username=staging_admin
# admin.password should be set via ADMIN_PASSWORD env var

user.username=staging_user
# user.password should be set via USER_PASSWORD env var

# ===============================
# TEST DATA SETTINGS
# ===============================
# Test data is created dynamically via TestDataFactory.
# No pre-seeded IDs required - tests are self-contained.
