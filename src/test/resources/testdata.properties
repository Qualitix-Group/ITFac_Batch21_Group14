# ===============================
# DEFAULT TEST DATA (LOCAL ENVIRONMENT)
# ===============================
# This file contains default values for local development.
# Environment-specific values can be set via:
#   1. Environment variables (e.g., ADMIN_PASSWORD)
#   2. System properties (e.g., -Dadmin.password=xxx)
#   3. Environment-specific files (e.g., testdata-staging.properties)

# ===============================
# BASE CONFIG
# ===============================
base.url=http://localhost:8080
api.base.url=http://localhost:8080

# ===============================
# USERS (Override with env vars for security)
# Environment variables: ADMIN_USERNAME, ADMIN_PASSWORD, USER_USERNAME, USER_PASSWORD
# ===============================
admin.username=admin
admin.password=admin123

user.username=testuser
user.password=test123

# ===============================
# TIMEOUTS (milliseconds)
# ===============================
timeout.default=10000
timeout.short=3000
timeout.long=30000

# ===============================
# RETRY SETTINGS
# ===============================
retry.max.attempts=3
retry.delay.ms=500
