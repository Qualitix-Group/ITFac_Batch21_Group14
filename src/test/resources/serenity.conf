# src/main/resources/serenity.conf
webdriver {
  driver = chrome
  autodownload = true
}

environments {
  default {
    webdriver.base.url = "http://localhost:8080/ui/login"
    login.url = "http://localhost:8080/ui/login"
  }
}

serenity {
  take.screenshots = FOR_FAILURES
  logging = VERBOSE

  # Browser settings
  browser.maximized = true
  browser.height = 1080
  browser.width = 1920

  # Timeouts
  timeout = 5000
  element.timeout = 10000
}

chrome.switches = """--start-maximized;--remote-allow-origins=*;--no-sandbox"""