serenity {
  project.name = "QA Training App - Serenity Automation"
  take.screenshots = FOR_FAILURES
  restart.browser.for.each = feature
}

headless.mode = false

webdriver {
  driver = chrome
  base.url = "http://localhost:8080"
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "remote-allow-origins=*",
        "test-type",
        "no-sandbox",
        "ignore-certificate-errors",
        "--window-size=1920,1080",
        "incognito",
        "disable-infobars",
        "disable-gpu",
        "disable-default-apps",
        "disable-popup-blocking",
        "disable-dev-shm-usage",
        "disable-extensions",
        "disable-web-security",
        "disable-translate",
        "disable-logging"
      ]
    }
  }
}

timeouts {
  implicitlywait = 0
  fluentwait = 10
}
